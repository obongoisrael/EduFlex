<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Log in — EduFlex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Inter', system-ui, sans-serif; -webkit-tap-highlight-color:transparent; }
    .inp { width:100%; border:1px solid #e2e8f0; border-radius:.875rem; padding:.8rem 1rem; font-size:1rem; min-height:3rem; transition:border-color .15s, box-shadow .15s; }
    .inp:focus { outline:none; border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.15); }
    .btn-primary { background:linear-gradient(135deg,#4f46e5,#4338ca); color:#fff; box-shadow:0 8px 24px -8px rgba(79,70,229,.7);
                   border-radius:.875rem; padding:.85rem 1.5rem; min-height:3rem; font-weight:600; width:100%; transition:transform .12s; }
    .btn-primary:active { transform:scale(.98); }
    .btn-primary:disabled { opacity:.6; }
  </style>
</head>
<body class="bg-gradient-to-b from-indigo-50 via-white to-white min-h-screen flex flex-col">

  <header class="h-16 flex items-center px-5">
    <a href="/" class="flex items-center gap-2.5">
      <span class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white grid place-items-center font-extrabold text-lg shadow-lg shadow-indigo-500/30">E</span>
      <span class="font-bold text-xl text-slate-900">EduFlex</span>
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-slate-900">Welcome back 👋</h1>
        <p class="text-sm text-slate-500 mt-1">Log in to continue your study plan.</p>

        <div id="error" class="hidden mt-5 text-sm bg-rose-50 text-rose-700 border border-rose-100 rounded-xl px-4 py-3"></div>

        <form id="loginForm" class="mt-6 space-y-4" novalidate>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5" for="email">Email address</label>
            <input id="email" type="email" required autocomplete="email" inputmode="email" class="inp" placeholder="you@university.ac.ke">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">Password</label>
            <input id="password" type="password" required autocomplete="current-password" class="inp" placeholder="••••••••">
          </div>
          <button type="submit" id="submitBtn" class="btn-primary">Log in</button>
        </form>

        <p class="text-sm text-slate-500 mt-6 text-center">
          Don't have an account?
          <a href="/register.html" class="text-indigo-600 font-semibold hover:underline">Register</a>
        </p>
      </div>
      <p class="text-center text-xs text-slate-400 mt-5">Demo account: demo@eduflex.app / demo1234</p>
    </div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('error');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showError('Please enter your email and password.');

      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed.');
        location.href = '/app.html#/dashboard';
      } catch (err) {
        showError(err.message);
        btn.disabled = false; btn.textContent = 'Log in';
      }
    });

    function showError(msg) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
  </script>
</body>
</html>
