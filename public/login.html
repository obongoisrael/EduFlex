<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f4579" />
  <link rel="icon" type="image/png" href="/brand/eduflex-icon-192.png" />
  <link rel="apple-touch-icon" href="/brand/eduflex-logo-512.png" />
  <title>Log in — EduFlex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Same brand palette as the app: "indigo" utilities render as EduFlex university navy.
    tailwind.config = { theme: { extend: { colors: { indigo: {
      50: '#f2f5fb', 100: '#e1e8f5', 200: '#c5d2ea', 300: '#9db2d9', 400: '#6f8bc2',
      500: '#4c6aab', 600: '#3a5594', 700: '#2f4579', 800: '#283a63', 900: '#223051', 950: '#151e35',
    } } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Poppins', system-ui, sans-serif; -webkit-tap-highlight-color:transparent; }
    .inp { width:100%; border:1px solid #e2e8f0; border-radius:.875rem; padding:.8rem 1rem; font-size:1rem; min-height:3rem; transition:border-color .15s, box-shadow .15s; }
    .inp:focus { outline:none; border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.15); }
    .btn-primary { background:linear-gradient(135deg,#4c6aab,#2f4579); color:#fff; box-shadow:0 8px 24px -8px rgba(47,69,121,.6);
                   border-radius:.875rem; padding:.85rem 1.5rem; min-height:3rem; font-weight:600; width:100%; transition:transform .12s; }
    .btn-primary:active { transform:scale(.98); }
    .btn-primary:disabled { opacity:.6; }
  </style>
</head>
<body class="bg-gradient-to-b from-indigo-50 via-white to-white min-h-screen flex flex-col">

  <header class="h-16 flex items-center px-5">
    <a href="/" class="flex items-center gap-2.5">
      <span class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#f6c453] to-[#e9a526] text-[#1c2745] grid place-items-center shadow-lg shadow-amber-500/30" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/><path d="M22 10v6"/></svg></span>
      <span class="font-bold text-xl text-slate-900">EduFlex</span>
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
        <p class="text-sm text-slate-500 mt-1">Log in to continue your study plan.</p>
        <div id="googleBlock" class="hidden mt-6">
          <a href="/api/auth/google" class="flex items-center justify-center gap-3 w-full min-h-[3rem] rounded-[.875rem] border border-slate-200 bg-white font-semibold text-slate-700 hover:bg-slate-50 active:scale-[.98] transition">
            <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Continue with Google</span>
          </a>
          <div class="flex items-center gap-3 mt-6 text-xs text-slate-400"><span class="flex-1 h-px bg-slate-200"></span>or with email<span class="flex-1 h-px bg-slate-200"></span></div>
        </div>

        <div id="notice" class="hidden mt-5 text-sm rounded-xl px-4 py-3"></div>
        <div id="error" class="hidden mt-5 text-sm bg-rose-50 text-rose-700 border border-rose-100 rounded-xl px-4 py-3"></div>
        <button id="resendBtn" type="button" class="hidden mt-3 w-full text-sm font-semibold text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-3">Resend the confirmation link</button>

        <form id="loginForm" class="mt-6 space-y-4" novalidate>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5" for="email">Email address</label>
            <input id="email" type="email" required autocomplete="email" inputmode="email" class="inp">
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-sm font-medium text-slate-700" for="password">Password</label>
              <a href="/forgot.html" class="text-xs font-semibold text-indigo-600 hover:underline">Forgot password?</a>
            </div>
            <input id="password" type="password" required autocomplete="current-password" class="inp">
          </div>
          <button type="submit" id="submitBtn" class="btn-primary">Log in</button>
        </form>

        <p class="text-sm text-slate-500 mt-6 text-center">
          Don't have an account?
          <a href="/register.html" class="text-indigo-600 font-semibold hover:underline">Register</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('error');
    const btn = document.getElementById('submitBtn');
    const resendBtn = document.getElementById('resendBtn');

    // Messages after following an email link
    const q = new URLSearchParams(location.search);
    if (q.get('verified')) notice('Your email is confirmed. Log in to continue.', true);
    if (q.get('verify') === 'invalid') notice('That confirmation link is invalid or has expired. Log in to get a new one.', false);
    if (q.get('reset')) notice('Password changed. Log in with your new password.', true);
    const GOOGLE_MSG = {
      cancelled: ['Google sign-in was cancelled.', false],
      error: ['Google sign-in did not complete. Please try again.', false],
      unverified: ['Your Google account email is not verified, so it cannot be used to sign in.', false],
      inactive: ['This account is inactive. Contact your EduFlex administrator.', false],
      school: ['Please use your university or college Google account.', false],
      unavailable: ['Google sign-in is not set up yet. Log in with your email and password.', false],
    };
    if (GOOGLE_MSG[q.get('google')]) notice(...GOOGLE_MSG[q.get('google')]);

    fetch('/api/auth/config').then(r => r.json()).then(c => {
      if (c.google) document.getElementById('googleBlock').classList.remove('hidden');
    }).catch(() => {});

    if (q.get('email')) document.getElementById('email').value = q.get('email');

    function notice(msg, ok) {
      const box = document.getElementById('notice');
      box.textContent = msg;
      box.className = 'mt-5 text-sm rounded-xl px-4 py-3 ' + (ok
        ? 'bg-emerald-50 text-emerald-800 border border-emerald-100'
        : 'bg-amber-50 text-amber-800 border border-amber-100');
    }

    resendBtn.addEventListener('click', async () => {
      resendBtn.disabled = true;
      try {
        const res = await fetch('/api/auth/resend-verification', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
        });
        const data = await res.json();
        errBox.classList.add('hidden');
        notice(data.message || 'A new link is on its way.', true);
      } catch { showError('Could not resend right now — try again shortly.'); }
      setTimeout(() => { resendBtn.disabled = false; }, 30000);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      resendBtn.classList.add('hidden');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showError('Please enter your email and password.');

      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (data.needs_verification) resendBtn.classList.remove('hidden');
        if (!res.ok) throw new Error(data.error || 'Login failed.');
        location.href = '/app.html#/dashboard';
      } catch (err) {
        showError(err.message);
        btn.disabled = false; btn.textContent = 'Log in';
      }
    });

    function showError(msg) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
  </script>
  <script src="/js/password-toggle.js"></script>
</body>
</html>
