<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f4579" />
  <title>Reset password — EduFlex</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Same brand palette as the app: "indigo" utilities render as EduFlex university navy.
    tailwind.config = { theme: { extend: { colors: { indigo: {
      50: '#f2f5fb', 100: '#e1e8f5', 200: '#c5d2ea', 300: '#9db2d9', 400: '#6f8bc2',
      500: '#4c6aab', 600: '#3a5594', 700: '#2f4579', 800: '#283a63', 900: '#223051', 950: '#151e35',
    } } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'Poppins', system-ui, sans-serif; -webkit-tap-highlight-color:transparent; }
    .inp { width:100%; border:1px solid #e2e8f0; border-radius:.875rem; padding:.8rem 1rem; font-size:1rem; min-height:3rem; transition:border-color .15s, box-shadow .15s; }
    .inp:focus { outline:none; border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.15); }
    .btn-primary { background:linear-gradient(135deg,#4c6aab,#2f4579); color:#fff; box-shadow:0 8px 24px -8px rgba(47,69,121,.6);
                   border-radius:.875rem; padding:.85rem 1.5rem; min-height:3rem; font-weight:600; width:100%; transition:transform .12s; }
    .btn-primary:active { transform:scale(.98); }
    .btn-primary:disabled { opacity:.6; }
  </style>
</head>
<body class="bg-gradient-to-b from-indigo-50 via-white to-white min-h-screen flex flex-col">

  <header class="h-16 flex items-center px-5">
    <a href="/" class="flex items-center gap-2.5">
      <span class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#f6c453] to-[#e9a526] text-[#1c2745] grid place-items-center shadow-lg shadow-amber-500/30" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/><path d="M22 10v6"/></svg></span>
      <span class="font-bold text-xl text-slate-900">EduFlex</span>
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-slate-900">Choose a new password</h1>
        <p class="text-sm text-slate-500 mt-1">After this, you'll be signed out on every device and can log in with the new password.</p>

        <div id="error" class="hidden mt-5 text-sm bg-rose-50 text-rose-700 border border-rose-100 rounded-xl px-4 py-3"></div>

        <form id="resetForm" class="mt-6 space-y-4" novalidate>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">New password</label>
            <input id="password" type="password" required minlength="8" autocomplete="new-password" class="inp" placeholder="••••••••">
            <p class="text-xs text-slate-400 mt-1.5">At least 8 characters, with letters and numbers.</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5" for="confirm">Confirm new password</label>
            <input id="confirm" type="password" required autocomplete="new-password" class="inp" placeholder="••••••••">
          </div>
          <button type="submit" id="submitBtn" class="btn-primary">Save new password</button>
        </form>

        <p class="text-sm text-slate-500 mt-6 text-center">
          Link expired? <a href="/forgot.html" class="text-indigo-600 font-semibold hover:underline">Request a new one</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const form = document.getElementById('resetForm');
    const btn = document.getElementById('submitBtn');
    const errBox = document.getElementById('error');
    const showError = (msg) => { errBox.textContent = msg; errBox.classList.remove('hidden'); };
    if (!token) { showError('This reset link is incomplete. Request a new one.'); form.classList.add('hidden'); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      const password = document.getElementById('password').value;
      if (password.length < 8 || !/[a-z]/i.test(password) || !/\d/.test(password))
        return showError('Password must be at least 8 characters, with letters and numbers.');
      if (password !== document.getElementById('confirm').value) return showError('The two passwords do not match.');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const res = await fetch('/api/auth/reset', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not reset your password.');
        location.href = '/login.html?reset=1';
      } catch (err) {
        showError(err.message);
        btn.disabled = false; btn.textContent = 'Save new password';
      }
    });
  </script>
</body>
</html>
